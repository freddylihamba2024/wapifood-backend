openapi: 3.0.3
info:
  title: WapiFood API
  version: 1.0.0
  description: |
    API REST du backend WapiFood (plateforme SaaS multi-restaurants).

    **Format des réponses** : toutes les réponses JSON utilisent une enveloppe commune.
    - Succès : `{ success: true, message, data, meta }`
    - Erreur : `{ success: false, message, errors, meta }` ; `meta.code` contient un code stable lisible par machine quand il existe.

    **Authentification** : jeton d'accès JWT (15 min) dans l'en-tête `Authorization: Bearer <access_token>`.
    Le renouvellement se fait avec le `refresh_token` (30 jours, à usage unique : chaque appel à `/auth/refresh`
    en fournit un nouveau). Réutiliser un refresh token déjà utilisé révoque toute la session.

    **Statut du compte** : après l'inscription, le compte est `pending` jusqu'à la vérification du téléphone par code SMS.
    Un compte `pending` n'accède qu'aux routes `/auth/*` ; les autres renvoient `403 ACCOUNT_NOT_VERIFIED`.

    **Codes d'erreur d'authentification** (`meta.code`) : `TOKEN_MISSING`, `TOKEN_INVALID`, `TOKEN_EXPIRED`,
    `TOKEN_REVOKED`, `ACCOUNT_SUSPENDED`, `ACCOUNT_NOT_VERIFIED`, `ACCOUNT_LOCKED`, `INVALID_CREDENTIALS`,
    `REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_REUSED`, `INVALID_CODE`, `OTP_COOLDOWN`, `OTP_QUOTA_EXCEEDED`,
    `OTP_DELIVERY_UNAVAILABLE`, `FORBIDDEN_ROLE`, `RESTAURANT_ACCESS_DENIED`, `RESTAURANT_REQUIRED`, `PERMISSION_DENIED`.

    **Espace restaurant** (`/restaurant/*`) : le restaurant est déterminé côté serveur à partir des appartenances
    de l'utilisateur ; l'en-tête `X-Restaurant-Id` le précise s'il en a plusieurs. Chaque route exige une permission
    liée au rôle dans le restaurant. Un restaurant suspendu est en lecture seule (`403 RESTAURANT_SUSPENDED`).

    **Images** : URL publiques servies par `GET /media/...` (hors API). Fichiers ré-encodés côté serveur.

    **Commandes** : le serveur recalcule tous les montants à partir du catalogue. Paiement : espèces uniquement
    (Mobile Money désactivé tant qu'aucun agrégateur n'est choisi). Le restaurant encaisse et doit la commission à WapiFood. En-tête `Idempotency-Key` recommandé à la création.

    **Montants** : toujours des chaînes décimales à 2 décimales (`"8.50"`), dans la devise du restaurant (USD ou CDF).

    **Pagination** : `?page=&per_page=` ; métadonnées dans `meta.pagination`.

    **Limitation des requêtes** : 120 requêtes / 60 s / IP par défaut. Au-delà : `429` + en-tête `Retry-After`.

    Ce document ne décrit que les routes réellement implémentées.
servers:
  - url: /api/v1
    description: API version 1
security:
  - bearerAuth: []

tags:
  - name: Système
    description: Supervision et état du service
  - name: Authentification
    description: Inscription, connexion, jetons et sessions
  - name: Compte
    description: Compte de l'utilisateur connecté (vérification, mot de passe, sessions)
  - name: Restaurants (public)
    description: Annuaire et menus, sans authentification
  - name: Espace restaurant
    description: Profil, adresses, horaires et équipe du restaurant
  - name: Catalogue
    description: Catégories, produits, variantes, options et images
  - name: Commandes (restaurant)
    description: File des commandes reçues et changements de statut
  - name: Finances
    description: Commission due à WapiFood et journal financier du restaurant (propriétaire)
  - name: Paiements
    description: Notifications des fournisseurs de paiement (inactives tant qu'aucun agrégateur n'est branché)
  - name: Espace client
    description: Adresses de livraison, favoris et commandes du client (rôle customer, compte vérifié)
  - name: Livraisons
    description: Livreur du restaurant, échec de livraison et preuve photo privée
  - name: Codes promo
    description: Codes promo du restaurant (remise à sa charge)
  - name: Avis
    description: Avis clients (commande terminée, un par commande) et note des restaurants
  - name: Notifications
    description: Notifications in-app du compte ou du restaurant (les e-mails, SMS et WhatsApp partent par la file d'envoi)
  - name: Administration
    description: Validation et supervision des restaurants, codes promo plateforme, modération des avis (super_admin)

paths:
  /health:
    get:
      tags: [Système]
      summary: État du service
      description: Vérifie que l'application répond et que la base de données est joignable. Aucune authentification requise.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Health'
              example:
                success: true
                message: Service opérationnel.
                data:
                  status: ok
                  service: wapifood-api
                  api_version: 1.0.0
                  time: '2026-11-25T14:00:00Z'
                  checks:
                    database: ok
                meta: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Base de données injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Service temporairement indisponible.
                errors:
                  database: unavailable
                meta:
                  health:
                    status: degraded
                    service: wapifood-api
                    api_version: 1.0.0
                    time: '2026-11-25T14:00:00Z'
                    checks:
                      database: unavailable

  /webhooks/payments/{provider}:
    post:
      tags: [Paiements]
      summary: Notification d'un fournisseur de paiement
      operationId: paymentWebhook
      description: |
        **Inactif au MVP** : aucun agrégateur Mobile Money n'est branché, la route répond `404` pour tout fournisseur.

        Quand un agrégateur sera activé : signature vérifiée (`401 WEBHOOK_SIGNATURE_INVALID` sinon), notification
        enregistrée une seule fois (rejeu → `duplicate`), montant et devise contrôlés avant de confirmer le paiement.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200':
          description: "Notification acquittée (`processed`, `duplicate` ou `ignored` si montant, devise ou référence ne correspondent pas)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte client ou propriétaire de restaurant
      description: |
        Crée un compte `pending`, ouvre une session et envoie un code de vérification par SMS.
        Mot de passe : 10 caractères minimum, avec minuscule, majuscule et chiffre, sans les informations personnelles.
        Limite : 10 inscriptions par heure et par IP.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              first_name: Grace
              last_name: Mbuyi
              email: grace@exemple.cd
              phone: '0812345678'
              password: Kinshasa-Secure-2026
              account_type: customer
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          tokens:
                            $ref: '#/components/schemas/Tokens'
                          phone_verification:
                            type: object
                            properties:
                              sent:
                                type: boolean
                                description: false si le SMS n'a pas pu partir (redemander via /auth/verify-phone/resend)
        '400':
          $ref: '#/components/responses/InvalidJson'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Authentification]
      summary: Se connecter par téléphone ou e-mail
      description: |
        `identifier` : numéro de téléphone (0812345678, +243812345678…) ou adresse e-mail.
        Après 5 échecs consécutifs, le compte est verrouillé 15 minutes (`429 ACCOUNT_LOCKED`).
        Limite : 10 requêtes par minute et par IP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: '0812345678'
              password: Kinshasa-Secure-2026
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          tokens:
                            $ref: '#/components/schemas/Tokens'
        '401':
          description: Identifiant ou mot de passe incorrect (même réponse si le compte n'existe pas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: Identifiant ou mot de passe incorrect.
                errors: {}
                meta:
                  code: INVALID_CREDENTIALS
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Compte verrouillé (`ACCOUNT_LOCKED`, `errors.retry_after` en secondes) ou limite de requêtes (`RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouveler la session (rotation du refresh token)
      description: |
        Renvoie une nouvelle paire de jetons. L'ancien refresh token devient inutilisable.
        Le réutiliser révoque toute la session (`401 REFRESH_TOKEN_REUSED`), car c'est le signe d'un vol de jeton.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/TokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Compte]
      summary: Se déconnecter
      description: Ferme la session courante ; avec `all_devices` à true, ferme toutes les sessions et invalide tous les jetons d'accès.
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices:
                  type: boolean
                  default: false
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [Compte]
      summary: Profil de l'utilisateur connecté
      operationId: me
      responses:
        '200':
          description: Utilisateur connecté
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags: [Compte]
      summary: Modifier son profil
      operationId: updateProfile
      description: |
        Prénom, nom et e-mail. Le téléphone (identifiant de connexion vérifié par SMS) n'est pas modifiable ici.
        Un nouvel e-mail doit être vérifié à nouveau (`email_verified: false`). Envoyer une chaîne vide efface le nom ou l'e-mail.
        Erreur : `409 EMAIL_TAKEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/verify-phone:
    post:
      tags: [Compte]
      summary: Vérifier le téléphone avec le code reçu par SMS
      description: Active le compte (`pending` → `active`). Un code expire après 10 minutes et est invalidé après 5 essais.
      operationId: verifyPhone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              code: '482913'
      responses:
        '200':
          description: Téléphone vérifié ; utilisateur mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/verify-phone/resend:
    post:
      tags: [Compte]
      summary: Renvoyer le code de vérification
      description: Un envoi par minute au maximum, 5 par heure.
      operationId: resendPhoneCode
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/OtpUnavailable'

  /auth/forgot-password:
    post:
      tags: [Authentification]
      summary: Demander un code de réinitialisation du mot de passe
      description: |
        Envoie un code par SMS (identifiant téléphone) ou par e-mail (identifiant e-mail).
        La réponse est identique, que le compte existe ou non.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
            example:
              identifier: '0812345678'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/OtpUnavailable'

  /auth/reset-password:
    post:
      tags: [Authentification]
      summary: Réinitialiser le mot de passe avec le code reçu
      description: Ferme toutes les sessions et invalide tous les jetons d'accès. L'utilisateur doit se reconnecter.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code, password]
              properties:
                identifier:
                  type: string
                code:
                  type: string
                  pattern: '^\d{4,8}$'
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/change-password:
    post:
      tags: [Compte]
      summary: Changer de mot de passe
      description: Renvoie de nouveaux jetons pour la session courante ; toutes les autres sessions sont fermées.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '200':
          $ref: '#/components/responses/TokensResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/sessions:
    get:
      tags: [Compte]
      summary: Lister les sessions actives (appareils connectés)
      operationId: listSessions
      responses:
        '200':
          description: Sessions actives, la plus récente en premier
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions/{sessionId}:
    delete:
      tags: [Compte]
      summary: Fermer une session
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
      responses:
        '204':
          description: Session fermée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [Notifications]
      summary: Mes notifications
      operationId: listMyNotifications
      description: |
        Notifications in-app, plus récentes d'abord. `meta.unread_count` : nombre de non lues.
        Tout compte vérifié (client, propriétaire, personnel…).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/UnreadFilter'
      responses:
        '200':
          description: "Notifications"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties:
                              unread_count:
                                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Tout marquer comme lu
      operationId: readAllMyNotifications
      responses:
        '200':
          description: "Nombre de notifications marquées"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReadAllResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Marquer une notification comme lue
      operationId: readMyNotification
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: "Notification lue"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants:
    get:
      tags: [Restaurants (public)]
      summary: Annuaire des restaurants
      operationId: listRestaurants
      description: |
        Restaurants validés (actifs ou fermés temporairement). Tri : actifs, mis en avant, puis par nom.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/Commune'
        - $ref: '#/components/parameters/Featured'
        - $ref: '#/components/parameters/Delivery'
        - $ref: '#/components/parameters/Pickup'
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RestaurantSummary'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Espace restaurant]
      summary: Inscrire un restaurant
      operationId: createRestaurant
      description: |
        Réservé aux comptes « restaurant_owner » vérifiés. Le restaurant est créé au statut « pending » et devient visible après validation.
        Le taux de commission, le statut et la mise en avant sont fixés par WapiFood (champs ignorés s'ils sont envoyés).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
      responses:
        '201':
          description: Restaurant créé (en attente de validation)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RestaurantManagement'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /restaurants/{restaurantId}:
    get:
      tags: [Restaurants (public)]
      summary: Fiche publique d'un restaurant
      operationId: getRestaurant
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Restaurant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RestaurantPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants/{restaurantId}/categories:
    get:
      tags: [Restaurants (public)]
      summary: Catégories actives du menu
      operationId: listRestaurantCategories
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Catégories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants/{restaurantId}/products:
    get:
      tags: [Restaurants (public)]
      summary: Produits commandables du menu
      operationId: listRestaurantProducts
      description: |
        Produits disponibles, dans une catégorie active ; seules les variantes et options actives sont listées.
      security: []
      parameters:

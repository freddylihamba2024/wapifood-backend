  /restaurant/orders/{orderId}/status:
    patch:
      tags: [Commandes (restaurant)]
      summary: Faire avancer une commande
      operationId: changeRestaurantOrderStatus
      description: |
        Permission `orders.manage`. Transitions autorisées :
        `pending → accepted | rejected` ; `accepted → preparing | cancelled` ; `preparing → ready` ;
        `ready → out_for_delivery` (livraison) ou `completed` (retrait) ; `out_for_delivery → completed`.
        Une livraison impossible s'annule par `POST …/delivery/failure`, jamais par ce changement de statut.

        La livraison suit la commande (`out_for_delivery` → `in_transit`, `completed` → `delivered`). Avec `out_for_delivery`,
        `courier_name` / `courier_phone` (facultatifs) renseignent le livreur.

        `reason` est obligatoire pour `rejected` et `cancelled` (affiché au client). Un refus ou une annulation
        annule aussi l'intention de paiement en espèces.

        Erreurs : `409 INVALID_STATUS_TRANSITION` (avec `errors.allowed`), `409 ORDER_STATUS_CHANGED`
        (modifiée entre-temps par le client : recharger), `403 RESTAURANT_SUSPENDED`.
      parameters:
        - $ref: '#/components/parameters/XRestaurantId'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Commande mise à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /restaurant/orders/{orderId}/cash-payment:
    post:
      tags: [Commandes (restaurant)]
      summary: Enregistrer un encaissement en espèces
      operationId: recordCashPayment
      description: |
        Permission `payments.record` (propriétaire, gérant, personnel, caissier). Possible quand la commande est prête,
        en livraison ou terminée. Erreurs : `409 PAYMENT_NOT_COLLECTABLE`, `409 PAYMENT_ALREADY_RECORDED`,
        `409 PAYMENT_METHOD_MISMATCH` (commande payée autrement qu'en espèces).
      parameters:
        - $ref: '#/components/parameters/XRestaurantId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: "Commande payée"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /restaurant/orders/{orderId}/delivery:
    put:
      tags: [Livraisons]
      summary: Indiquer le livreur
      operationId: assignCourier
      description: |
        Permission `deliveries.manage`. Le livreur du restaurant n'a pas de compte : nom (obligatoire), téléphone et note facultatifs.
        Possible de l'acceptation jusqu'à la livraison (`pending → assigned`). Le client voit le nom et le téléphone, pas la note.
        Erreurs : `409 DELIVERY_NOT_ASSIGNABLE`, `409 ORDER_NOT_DELIVERY` (commande à retirer).
      parameters:
        - $ref: '#/components/parameters/XRestaurantId'
        - $ref: '#/components/parameters/OrderId'

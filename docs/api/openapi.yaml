                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LedgerEntry'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/restaurants/{restaurantId}/settlements:
    post:
      tags: [Administration]
      summary: Enregistrer un règlement de commission
      operationId: recordSettlement
      description: |
        Le restaurant a payé tout ou partie de sa commission. Ne peut pas dépasser le montant dû (`409 SETTLEMENT_EXCEEDS_DUE`).
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementRequest'
      responses:
        '201':
          description: "Écriture créée"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEntry'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/restaurants/{restaurantId}/adjustments:
    post:
      tags: [Administration]
      summary: Ajustement manuel motivé
      operationId: recordAdjustment
      description: |
        Montant signé : positif = augmente la dette du restaurant, négatif = la diminue. Motif obligatoire.
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentRequest'
      responses:
        '201':
          description: "Écriture créée"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEntry'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/orders/{orderId}:
    get:
      tags: [Administration]
      summary: Détail d'une commande (support)
      operationId: adminShowOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: "Commande avec remboursements"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{orderId}/refunds:
    post:
      tags: [Administration]
      summary: Enregistrer un remboursement
      operationId: recordRefund
      description: |
        Remboursement effectué hors ligne (espèces). Plusieurs remboursements partiels possibles, jamais plus que le montant payé
        (`422 REFUND_EXCEEDS_PAID`). Commande non payée : `409 PAYMENT_NOT_REFUNDABLE`.
        Remboursement total : la commission est annulée (écriture `commission_reversed`). Partiel : commission inchangée.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: "Remboursement enregistré"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefundResult'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/orders/{orderId}/delivery/proof:
    get:
      tags: [Administration]
      summary: Preuve de livraison (support)
      operationId: adminDeliveryProof
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: "Image"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/promotions:
    get:
      tags: [Administration]
      summary: Codes promo plateforme
      operationId: listPlatformPromotions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ActiveFilter'
      responses:
        '200':
          description: "Codes plateforme"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Promotion'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Administration]
      summary: Créer un code promo plateforme
      operationId: createPlatformPromotion
      description: |
        Remise à la charge de WapiFood : la commission est calculée avant remise, et le restaurant est crédité de la remise
        (écriture `platform_discount`) quand la commande est terminée. `currency` obligatoire si le code contient un montant
        (remise fixe, minimum ou plafond) ; sans devise, un pourcentage s'applique dans toutes les devises.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionInput'
      responses:
        '201':
          description: "Code créé"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/promotions/{promotionId}:
    get:
      tags: [Administration]
      summary: Détail d'un code plateforme
      operationId: showPlatformPromotion
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      responses:
        '200':
          description: "Code promo"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Administration]
      summary: Modifier un code plateforme
      operationId: updatePlatformPromotion
      description: |
        Mêmes règles que pour un code restaurant.
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionInput'
      responses:
        '200':
          description: "Code mis à jour"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Administration]
      summary: Supprimer un code plateforme
      operationId: deletePlatformPromotion
      description: |
        Seulement s'il n'a jamais été utilisé.
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      responses:
        '204':
          description: "Code supprimé"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/promotions/{promotionId}/status:
    patch:
      tags: [Administration]
      summary: Activer ou désactiver un code plateforme
      operationId: setPlatformPromotionStatus
      parameters:
        - $ref: '#/components/parameters/PromotionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionStatusRequest'
      responses:
        '200':
          description: "Code mis à jour"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/reviews:
    get:
      tags: [Administration]
      summary: Avis (modération)
      operationId: adminListReviews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ReviewStatusFilter'
        - $ref: '#/components/parameters/RatingFilter'
        - $ref: '#/components/parameters/RestaurantFilter'
      responses:
        '200':
          description: "Avis"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminReview'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/reviews/{reviewId}/moderation:
    patch:
      tags: [Administration]
      summary: Masquer ou republier un avis
      operationId: moderateReview
      description: |
        Un avis masqué disparaît de la fiche publique et de la note moyenne. Motif obligatoire pour masquer. Action tracée dans le journal d'audit.
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      responses:
        '200':
          description: "Avis modéré"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminReview'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/notifications:
    get:
      tags: [Administration]
      summary: File des notifications
      operationId: adminListNotifications
      description: |
        Supervision des envois (tous canaux). Filtres : `status`, `channel`, `type` (ex. `order.accepted`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/NotificationStatusFilter'
        - $ref: '#/components/parameters/NotificationChannelFilter'
        - $ref: '#/components/parameters/NotificationTypeFilter'
      responses:
        '200':
          description: "Notifications"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminNotification'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/notifications/{notificationId}:
    get:
      tags: [Administration]
      summary: Détail d'une notification
      operationId: adminShowNotification
      description: |
        Avec l'historique des tentatives d'envoi.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: "Notification"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminNotificationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/notifications/{notificationId}/retry:
    post:
      tags: [Administration]
      summary: Renvoyer une notification en échec
      operationId: adminRetryNotification
      description: |
        Remet en file une notification `failed` avec de nouvelles tentatives (historique conservé). Autre statut : `409 NOTIFICATION_NOT_FAILED`.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: "Notification remise en file"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminNotificationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    XRestaurantId:
      name: X-Restaurant-Id
      in: header
      required: false
      description: Restaurant ciblé, obligatoire si l'utilisateur appartient à plusieurs restaurants (403 RESTAURANT_REQUIRED sinon).
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: Numéro de page (1 par défaut)
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Éléments par page (20 par défaut, 100 maximum)
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Search:
      name: q
      in: query
      required: false
      description: Recherche textuelle (nom)
      schema:
        type: string
    City:
      name: city
      in: query
      required: false
      description: Ville (ex. Kinshasa)
      schema:
        type: string
    Commune:
      name: commune
      in: query
      required: false
      description: Commune (ex. Gombe)
      schema:
        type: string
    Featured:
      name: featured
      in: query
      required: false
      description: Uniquement les éléments mis en avant
      schema:
        type: boolean
    Delivery:
      name: delivery
      in: query
      required: false
      description: Uniquement les restaurants qui livrent
      schema:
        type: boolean
    Pickup:
      name: pickup
      in: query
      required: false
      description: Uniquement les restaurants avec retrait sur place
      schema:
        type: boolean
    Available:
      name: available
      in: query
      required: false
      description: Filtrer sur la disponibilité
      schema:
        type: boolean
    CategoryFilter:
      name: category_id
      in: query
      required: false
      description: Filtrer sur une catégorie
      schema:
        type: integer
    StatusFilter:
      name: status
      in: query
      required: false
      description: Statut du restaurant
      schema:
        type: string
        enum: [pending, active, paused, rejected, suspended]
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Un ou plusieurs statuts séparés par des virgules (`pending,accepted`), ou `active` pour les commandes en cours
        (pending, accepted, preparing, ready, out_for_delivery).
      schema:
        type: string
        example: active
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Commandes créées à partir de ce jour (UTC, AAAA-MM-JJ)
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      description: Commandes créées jusqu'à ce jour inclus (UTC, AAAA-MM-JJ)
      schema:
        type: string
        format: date
    OrderNumberSearch:
      name: q
      in: query
      required: false
      description: Numéro de commande (recherche partielle)
      schema:
        type: string
        maxLength: 40
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Recommandé. Identifiant unique généré par l'application pour ce panier (8 à 64 caractères : lettres, chiffres, `-`, `_`).
        En cas de nouvel envoi (réseau instable, double appui), la commande déjà créée est renvoyée au lieu d'en créer une seconde.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'
        example: 3f2b9c1e-7a44-4d0e-9b1a-2c5d8e6f0a11
    CurrencyFilter:
      name: currency
      in: query
      required: false
      schema:
        type: string
        enum: [USD, CDF]
    OnlyDue:
      name: only_due
      in: query
      required: false
      description: Seulement les soldes strictement positifs
      schema:
        type: boolean
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        example: mpesa
    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ActiveFilter:
      name: active
      in: query
      description: true = codes actifs, false = codes désactivés
      schema:
        type: boolean
    ReviewStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [published, hidden, pending]
    RatingFilter:
      name: rating
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5
    RestaurantFilter:
      name: restaurant_id
      in: query
      schema:
        type: integer
        minimum: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UnreadFilter:
      name: unread
      in: query
      description: true = non lues uniquement
      schema:
        type: boolean
    NotificationStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [queued, sent, failed, read]
    NotificationChannelFilter:
      name: channel
      in: query
      schema:
        type: string
        enum: [in_app, email, sms, whatsapp, push]
    NotificationTypeFilter:
      name: type
      in: query
      schema:
        type: string
        example: order.accepted
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          description: Contenu de la réponse (objet ou liste)
        meta:
          type: object
          nullable: true
          description: Pagination ou informations complémentaires

    ErrorEnvelope:
      type: object
      required: [success, message, errors, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
          description: Erreurs par champ (validation) ou par règle ; objet vide si aucune
        meta:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: Code d'erreur stable (ex. VALIDATION_FAILED, RATE_LIMITED)

    Health:
      type: object
      required: [status, service, api_version, time, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        api_version:
          type: string
        time:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, unavailable]

    RegisterRequest:
      type: object
      required: [first_name, phone, password, account_type]
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          format: email
          maxLength: 190
          nullable: true
        phone:
          type: string
          description: Numéro congolais (0812345678, 812345678, +243812345678) ou international (+XXXXXXXX)
        password:
          type: string
          minLength: 10
          maxLength: 128
        account_type:
          type: string
          enum: [customer, restaurant_owner]

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Téléphone ou e-mail
        password:
          type: string

    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{4,8}$'

    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string

            type: object
            required: [name]
            properties:
              id:
                type: integer
              name:
                type: string
              price_delta:
                type: string
                description: Écart par rapport au prix de base (peut être négatif ; prix final ≥ 0)
              is_active:
                type: boolean
        option_groups:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, options]
            properties:
              id:
                type: integer
              name:
                type: string
              selection_type:
                type: string
                enum: [single, multiple]
                default: single
              is_required:
                type: boolean
              min_selections:
                type: integer
                minimum: 0
              max_selections:
                type: integer
                minimum: 1

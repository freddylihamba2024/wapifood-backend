      summary: Mes commandes
      operationId: listCustomerOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/OrderStatusFilter'
      responses:
        '200':
          description: Liste paginée (plus récentes d'abord)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderSummary'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Espace client]
      summary: Passer une commande
      operationId: createOrder
      description: |
        Tous les montants sont recalculés côté serveur à partir du catalogue : seuls les identifiants et quantités sont lus.
        Le restaurant doit être actif et ouvert (maintenant, ou à `requested_for`).

        Codes d'erreur (`meta.code`) :
        - `404 RESTAURANT_NOT_FOUND` : restaurant inexistant ou non visible.
        - `409 RESTAURANT_CLOSED` : fermé temporairement, ou hors horaires.
        - `422 ORDER_TYPE_UNAVAILABLE` : livraison ou retrait non proposé.
        - `422 PAYMENT_METHOD_UNAVAILABLE` : seul `cash` est accepté pour le moment.
        - `422 ORDER_ITEMS_INVALID` : article introuvable, indisponible, variante ou options invalides (détail par ligne dans `errors`, ex. `items.0.option_ids`).
        - `422 MINIMUM_ORDER_NOT_REACHED` : `errors.minimum_order_amount` et `errors.subtotal`.
        - `409 PRICE_CHANGED` : `expected_total` différent du total recalculé (`errors.total_amount`).
        - `409 IDEMPOTENCY_KEY_REUSED` : clé déjà utilisée pour une commande d'un autre restaurant.

        Limite : 20 commandes / 10 min par compte.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '200':
          description: "Commande déjà enregistrée avec cette clé d'idempotence (en-tête `Idempotent-Replayed: true`)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'


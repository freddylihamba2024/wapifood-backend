    OpeningHour:
      type: object
      properties:
        day_of_week:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = lundi … 7 = dimanche
        is_closed:
          type: boolean
        opens_at:
          type: string
          nullable: true
          example: '09:00'
        closes_at:
          type: string
          nullable: true
          example: '22:00'

    OpeningHoursRequest:
      type: object
      required: [days]
      properties:
        days:
          type: array
          maxItems: 7
          items:
            type: object
            required: [day_of_week]
            properties:
              day_of_week:
                type: integer
                minimum: 1
                maximum: 7
              is_closed:
                type: boolean
              opens_at:
                type: string
                pattern: '^([01]\d|2[0-3]):[0-5]\d$'
              closes_at:
                type: string
                pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example:
        days:
          - day_of_week: 1
            opens_at: '09:00'
            closes_at: '22:00'
          - day_of_week: 5
            opens_at: '18:00'
            closes_at: '02:00'
          - day_of_week: 7
            is_closed: true


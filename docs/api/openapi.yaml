                  required: [name]
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    price_delta:
                      type: string
                      description: Supplément (≥ 0)
                    is_active:
                      type: boolean
      example:
        name: Burger maison
        base_price: '8.50'
        category_id: 3
        variants:
          - name: Simple
            price_delta: '0'
          - name: Double
            price_delta: '3.00'
        option_groups:
          - name: Cuisson
            selection_type: single
            is_required: true
            options:

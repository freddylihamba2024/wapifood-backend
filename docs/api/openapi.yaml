                    format: date-time
            next_statuses:
              type: array
              description: Statuts que l'utilisateur courant (client ou restaurant) peut appliquer
              items:
                type: string
            promotion:
              $ref: '#/components/schemas/OrderPromotion'
            delivery:
              $ref: '#/components/schemas/Delivery'
            review:
              allOf:
                - $ref: '#/components/schemas/Review'
              nullable: true
              description: Client uniquement
            can_review:
              type: boolean
              description: Client uniquement — la commande peut encore recevoir un avis

    OrderStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected, preparing, ready, out_for_delivery, completed, cancelled]
        reason:
          type: string
          maxLength: 500
          description: Obligatoire pour rejected et cancelled
        courier_name:
          type: string
          maxLength: 150
          description: Facultatif, pris en compte avec out_for_delivery (livreur du restaurant)
        courier_phone:
          type: string
          description: Facultatif, avec courier_name

    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    FinanceBalance:
      type: object
      properties:
        currency:
          type: string
          enum: [USD, CDF]
        commission_due:
          $ref: '#/components/schemas/Money'
        commission_pending:
          $ref: '#/components/schemas/Money'

    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [commission_accrued, commission_reversed, commission_settlement, payout, adjustment, platform_discount, platform_discount_reversed]
          description: |
            platform_discount (−) : remise d'un code promo WapiFood créditée au restaurant ; platform_discount_reversed (+) : son annulation (remboursement total)
        currency:
          type: string
          enum: [USD, CDF]
        amount:
          $ref: '#/components/schemas/Money'
        balance_after:
          $ref: '#/components/schemas/Money'
        order_id:
          type: integer
          nullable: true
        order_number:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminBalance:
      type: object
      properties:
        restaurant:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            status:
              type: string
        currency:
          type: string
        commission_due:
          $ref: '#/components/schemas/Money'
        updated_at:
          type: string
          format: date-time

    SettlementRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          enum: [USD, CDF]
        reference:
          type: string
          maxLength: 120
          description: Référence du reçu ou du virement
        note:
          type: string
          maxLength: 500

    AdjustmentRequest:
      type: object
      required: [amount, currency, note]
      properties:
        amount:
          type: string
          description: Montant signé (« -2.50 »)
          example: '-2.50'
        currency:
          type: string
          enum: [USD, CDF]
        note:
          type: string
          minLength: 3
          maxLength: 500

    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 3
          maxLength: 500

    RefundResult:
      type: object
      properties:
        refund_id:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        total_refunded:
          $ref: '#/components/schemas/Money'
        payment_status:
          type: string
          enum: [partially_refunded, refunded]

    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            refunds:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  amount:
                    $ref: '#/components/schemas/Money'
                  currency:
                    type: string
                  status:
                    type: string
                    enum: [pending, completed, failed]
                  reason:
                    type: string
                  created_at:
                    type: string
                    format: date-time

    RatingSummary:
      type: object
      properties:
        average:
          type: string
          nullable: true
          example: '4.5'
          description: Moyenne des avis publiés, au dixième (null sans avis)
        count:
          type: integer

    Promotion:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: BIENVENUE10
        title:
          type: string
        scope:
          type: string
          enum: [restaurant, platform]
          description: restaurant = remise à la charge du restaurant ; platform = à la charge de WapiFood
        restaurant_id:
          type: integer
          nullable: true
        discount_type:
          type: string
          enum: [percentage, fixed]
        discount_value:
          $ref: '#/components/schemas/Money'
        minimum_order_amount:
          $ref: '#/components/schemas/Money'
        maximum_discount_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        currency:
          type: string
          enum: [USD, CDF]
          nullable: true
        usage_limit:
          type: integer
          nullable: true
        usage_per_customer:
          type: integer
          nullable: true
        usage_count:
          type: integer
          description: Utilisations comptées dans les limites (commandes ni refusées ni annulées)
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    PromotionInput:
      type: object
      required: [code, title, discount_type, discount_value]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,30}$'
          description: Enregistré en majuscules, unique sur la plateforme
        title:
          type: string
          maxLength: 150
        discount_type:
          type: string
          enum: [percentage, fixed]
        discount_value:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Pourcentage (0 < x ≤ 100) ou montant fixe
        minimum_order_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sous-total minimum (hors livraison), 0 par défaut
        maximum_discount_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Plafond d'une remise en pourcentage
        currency:
          type: string
          enum: [USD, CDF]
          description: Code restaurant = devise du restaurant. Code plateforme = obligatoire si le code contient un montant
        usage_limit:
          type: integer
          minimum: 1
        usage_per_customer:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
          example: '2026-12-01T00:00:00+01:00'
        ends_at:
          type: string
          format: date-time
        is_active:
          type: boolean
          default: true

    PromotionStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean

    OrderPromotion:
      type: object
      nullable: true
      properties:
        code:
          type: string
        title:
          type: string
        funded_by:
          type: string
          enum: [restaurant, platform]
        discount_amount:
          $ref: '#/components/schemas/Money'

    Delivery:
      type: object
      nullable: true
      description: Livraison par le restaurant (null pour un retrait sur place)
      properties:
        status:
          type: string
          enum: [pending, assigned, picked_up, in_transit, delivered, failed, cancelled]
        managed_by:
          type: string
          enum: [restaurant, wapifood]
        courier_name:
          type: string
          nullable: true
        courier_phone:
          type: string
          nullable: true
        picked_up_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
          description: Restaurant uniquement
        has_proof:
          type: boolean
          description: Restaurant uniquement

    CourierAssignment:
      type: object
      required: [courier_name]
      properties:
        courier_name:
          type: string
          minLength: 2
          maxLength: 150
        courier_phone:
          type: string
          example: '0991234567'
        notes:
          type: string
          maxLength: 1000

    DeliveryFailureRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          example: Client injoignable à l'adresse indiquée

    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    PublicReview:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        author:
          type: string
          example: Grâce M.
        created_at:
          type: string
          format: date-time

    Review:
      allOf:
        - $ref: '#/components/schemas/PublicReview'
        - type: object
          properties:
            status:
              type: string
              enum: [published, hidden, pending]
            order_id:
              type: integer
            order_number:
              type: string
            restaurant:
              type: object
              description: Client uniquement
              properties:
                id:
                  type: integer
                name:
                  type: string

    AdminReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            customer_id:
              type: integer
            moderated_at:
              type: string
              format: date-time
              nullable: true
            moderation_reason:
              type: string
              nullable: true

    ModerationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [hidden, published]
        reason:
          type: string
          maxLength: 500
          description: Obligatoire pour masquer

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: order.accepted
          description: |
            order.placed, order.cancelled_by_customer, order.accepted, order.rejected, order.preparing, order.ready,
            order.out_for_delivery, order.completed, order.cancelled, order.delivery_failed, payment.refunded,
            review.created, restaurant.approved, restaurant.rejected, restaurant.suspended, restaurant.reactivated
        title:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true
          description: Liens profonds (order_id, order_number, restaurant_id)
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ReadAllResult:
      type: object
      properties:
        updated:
          type: integer

    AdminNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            channel:
              type: string
              enum: [in_app, email, sms, whatsapp, push]
            recipient:
              type: string
              nullable: true
            status:
              type: string
              enum: [queued, sent, failed, read]
            user_id:
              type: integer
              nullable: true
            restaurant_id:
              type: integer
              nullable: true
            attempts:
              type: integer
            max_attempts:
              type: integer
            next_attempt_at:
              type: string
              format: date-time
              nullable: true
            last_error:
              type: string
              nullable: true
            sent_at:
              type: string
              format: date-time
              nullable: true

    AdminNotificationDetail:
      allOf:
        - $ref: '#/components/schemas/AdminNotification'
        - type: object
          properties:
            attempt_history:
              type: array
              items:
                type: object
                properties:
                  attempt:
                    type: integer
                  provider:
                    type: string
                  status:
                    type: string
                    enum: [sent, failed]
                  provider_message_id:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time

    WebhookResult:
      type: object
      properties:
        status:
          type: string
          enum: [processed, duplicate, ignored]

  responses:
    Unauthorized:
      description: Non authentifié ou session invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Session expirée. Renouvelez votre jeton.
            errors: {}
            meta:
              code: TOKEN_EXPIRED
    Forbidden:
      description: Accès refusé (compte suspendu, non vérifié, rôle ou permission insuffisants)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Ce compte est suspendu. Contactez le support WapiFood.
            errors: {}
            meta:
              code: ACCOUNT_SUSPENDED
    Conflict:
      description: Conflit métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Ce numéro de téléphone est déjà associé à un compte.
            errors:
              phone: Déjà utilisé.
            meta:
              code: PHONE_TAKEN
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Les données envoyées sont invalides.
            errors:
              phone: Le champ téléphone est obligatoire.
            meta:
              code: VALIDATION_FAILED
    InvalidJson:
      description: Corps de requête JSON invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Le corps de la requête n'est pas un JSON valide.
            errors: {}
            meta:
              code: INVALID_JSON
    OtpUnavailable:
      description: Aucun fournisseur d'envoi de codes n'est configuré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: L'envoi de codes de vérification est momentanément indisponible.
            errors: {}
            meta:
              code: OTP_DELIVERY_UNAVAILABLE
    EmptySuccess:
      description: Opération effectuée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
          example:
            success: true
            message: Opération effectuée avec succès.
            data: {}
            meta: null
    TokensResponse:
      description: Nouvelle paire de jetons
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      tokens:
                        $ref: '#/components/schemas/Tokens'
    NotFound:
      description: Ressource ou route introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Ressource introuvable.
            errors: {}
            meta: null
    TooManyRequests:
      description: Limite de requêtes atteinte
      headers:
        Retry-After:
          description: Délai en secondes avant de réessayer
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Trop de requêtes. Réessayez plus tard.
            errors: {}
            meta:
              code: RATE_LIMITED
